<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PERXIA Design Canvas — visor de artboards con pan/zoom.
     El agente SOLO edita el bloque CONFIG de abajo; el resto es el visor. -->
<title>Canvas · PERXIA Design</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101210; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; }
  #toolbar { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; align-items: center; gap: 8px;
             background: #1b1f1b; border: 1px solid #242824; border-radius: 999px; padding: 8px 14px; color: #f2f5f2; }
  #toolbar .brand { display: flex; align-items: center; gap: 8px; font-family: Outfit, sans-serif; font-weight: 700;
                    font-size: 12px; letter-spacing: 0.18em; padding-right: 10px; border-right: 1px solid #242824; }
  #toolbar .brand b { color: #6dfd8c; font-weight: 700; }
  #toolbar button { background: none; border: 1px solid #242824; color: #f2f5f2; border-radius: 999px;
                    width: 28px; height: 28px; font-size: 15px; cursor: pointer; line-height: 1; }
  #toolbar button.wide { width: auto; padding: 0 12px; font-size: 11px; font-weight: 600; }
  #toolbar button:hover { border-color: #6dfd8c; color: #6dfd8c; }
  #toolbar #zoom-label { font-size: 11px; color: #8a968a; min-width: 40px; text-align: center; }
  #viewport { position: absolute; inset: 0; cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; transform-origin: 0 0; }
  .artboard { position: absolute; display: flex; flex-direction: column; gap: 8px; }
  .artboard .title { font-size: 12px; font-weight: 600; color: #8a968a; letter-spacing: 0.04em; }
  .artboard iframe { border: 1px solid #242824; border-radius: 4px; background: #ffffff; width: 100%; height: 100%; display: block; }
  .artboard .frame { box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
  .hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #5d675d; }
</style>
</head>
<body>
<div id="toolbar">
  <span class="brand">PER<b>XIA</b> DESIGN</span>
  <button id="zoom-out" title="Alejar">−</button>
  <span id="zoom-label">100%</span>
  <button id="zoom-in" title="Acercar">+</button>
  <button id="zoom-fit" class="wide" title="Ajustar todo">Ajustar</button>
  <button id="zoom-100" class="wide" title="Tamaño real">100%</button>
</div>
<div id="viewport"><div id="world"></div></div>
<div class="hint">Arrastra para moverte · rueda o pellizco para zoom · doble clic en un artboard para abrirlo solo</div>

<script>
/* ============================ CONFIG ============================
   El agente reemplaza TITLE y ARTBOARDS. Cada artboard es un HTML
   autocontenido en ./artboards/. x, y, w, h en píxeles de canvas.
   Requisitos: cada ARTBOARDS[].src debe existir; logos/imágenes van
   inline, data: URI, o ../assets/ copiados bajo este encargo — nunca
   rutas del app fuera de design/<encargo>/. Tras refinar, re-sincroniza
   ARTBOARDS con artboards/*.html para evitar frames en blanco. */
const TITLE = "Registro como proveedor · Diseño";
const ARTBOARDS = [
  { src: "./artboards/Chat.html", title: "Experiencia de chat · caso Ecuador", x: 0, y: 0, w: 1200, h: 1040 },
  { src: "./artboards/Sistema.html", title: "Sistema visual · componentes y tokens", x: 1280, y: 0, w: 880, h: 1000 },
];
/* ================================================================ */

document.title = TITLE;
const world = document.getElementById('world');
const viewport = document.getElementById('viewport');
const zoomLabel = document.getElementById('zoom-label');
let scale = 1, tx = 0, ty = 0;

for (const ab of ARTBOARDS) {
  const el = document.createElement('div');
  el.className = 'artboard';
  el.style.left = ab.x + 'px';
  el.style.top = ab.y + 'px';
  el.style.width = ab.w + 'px';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = ab.title;
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.width = ab.w + 'px';
  frame.style.height = ab.h + 'px';
  const iframe = document.createElement('iframe');
  iframe.src = ab.src;
  iframe.title = ab.title;
  frame.appendChild(iframe);
  el.appendChild(title);
  el.appendChild(frame);
  el.addEventListener('dblclick', () => { window.open(ab.src, '_blank'); });
  world.appendChild(el);
}

function apply() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomLabel.textContent = Math.round(scale * 100) + '%';
}
function zoomAt(cx, cy, factor) {
  const next = Math.min(3, Math.max(0.05, scale * factor));
  tx = cx - (cx - tx) * (next / scale);
  ty = cy - (cy - ty) * (next / scale);
  scale = next;
  apply();
}
function fit() {
  const pad = 60;
  const maxX = Math.max(...ARTBOARDS.map(a => a.x + a.w));
  const maxY = Math.max(...ARTBOARDS.map(a => a.y + a.h + 24));
  const minX = Math.min(...ARTBOARDS.map(a => a.x));
  const minY = Math.min(...ARTBOARDS.map(a => a.y));
  const sw = (innerWidth - pad * 2) / (maxX - minX);
  const sh = (innerHeight - pad * 2) / (maxY - minY);
  scale = Math.min(sw, sh, 1);
  tx = pad - minX * scale + (innerWidth - pad * 2 - (maxX - minX) * scale) / 2;
  ty = pad - minY * scale;
  apply();
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
  } else {
    tx -= e.deltaX; ty -= e.deltaY; apply();
  }
}, { passive: false });

let panning = false, px = 0, py = 0;
viewport.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.artboard')) return;
  panning = true; px = e.clientX; py = e.clientY;
  viewport.classList.add('panning');
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', (e) => {
  if (!panning) return;
  tx += e.clientX - px; ty += e.clientY - py;
  px = e.clientX; py = e.clientY;
  apply();
});
viewport.addEventListener('pointerup', () => { panning = false; viewport.classList.remove('panning'); });

document.getElementById('zoom-in').addEventListener('click', () => zoomAt(innerWidth / 2, innerHeight / 2, 1.2));
document.getElementById('zoom-out').addEventListener('click', () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2));
document.getElementById('zoom-fit').addEventListener('click', fit);
document.getElementById('zoom-100').addEventListener('click', () => { scale = 1; apply(); });
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
